<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117">
  <title>DigiKeyboard - Remote PC Keyboard</title>
  <style>
:root {
  --bg: #0d1117;
  --header-bg: #161b22;
  --panel-bg: #1c2128;
  --key-bg: #21262d;
  --key-active-bg: #1f6feb;
  --key-active-border: #388bfd;
  --key-shadow: #111418;
  --key-border: #30363d;
  --key-special: #1b2028;
  --key-mod-active: #238636;
  --accent: #58a6ff;
  --text: #f0f6fc;
  --text-dim: #8b949e;
  --danger: #da3633;
  --enter-bg: #1f4068;
  --enter-border: #2a5286;
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
}
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
  overflow: hidden;
}

/* ─── TOP BAR ─── */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--header-bg);
  border-bottom: 1px solid var(--key-border);
  padding: 5px 10px;
  height: 44px;
  flex-shrink: 0;
  z-index: 10;
  gap: 8px;
}
.logo {
  font-weight: 800;
  font-size: 13px;
  color: var(--accent);
  white-space: nowrap;
}
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--key-border);
  white-space: nowrap;
}
.status-badge .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #f85149;
  flex-shrink: 0;
}
.status-badge.connected .dot { background: #3fb950; box-shadow: 0 0 5px #3fb950; }
.ping { font-size: 10px; color: var(--text-dim); font-family: monospace; }
.right-controls { display: flex; gap: 5px; align-items: center; }
.left-controls { display: flex; gap: 6px; align-items: center; }
.tbtn {
  background: var(--key-bg);
  border: 1px solid var(--key-border);
  color: var(--text);
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all .12s;
}
.tbtn.on {
  background: var(--key-active-bg);
  border-color: var(--key-active-border);
  color: #fff;
}

/* ─── MODIFIER STRIP ─── */
.mod-strip {
  display: flex;
  justify-content: center;
  gap: 8px;
  background: #111419;
  padding: 2px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  flex-shrink: 0;
}
.mod-pill {
  font-size: 9px;
  font-weight: 700;
  color: #484f58;
  padding: 1px 6px;
  border-radius: 4px;
  letter-spacing: .5px;
  transition: all .12s;
}
.mod-pill.on {
  color: #fff;
  background: var(--key-mod-active);
  box-shadow: 0 0 5px rgba(35,134,54,.6);
}

/* ─── COLLAPSIBLE PANELS ─── */
.panel {
  display: flex;
  background: var(--panel-bg);
  padding: 4px 8px;
  gap: 4px;
  overflow-x: auto;
  border-bottom: 1px solid var(--key-border);
  flex-shrink: 0;
  scrollbar-width: none;
}
.panel::-webkit-scrollbar { display: none; }
.panel.hidden { display: none !important; }

/* ─── SHORTCUT BAR ─── */
.sc-btn {
  background: #252c37;
  border: 1px solid var(--key-border);
  color: var(--accent);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}
.sc-btn:active { background: var(--key-active-bg); color: #fff; }
.sc-btn.danger { color: #ff7b72; }

/* ─── FN / NAV ROW KEYS ─── */
.fn-key, .nav-key {
  flex: 1;
  min-width: 28px;
  height: 34px;
  font-size: 11px;
}

/* ─── KEYBOARD CONTAINER ─── */
.kb-wrap {
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  justify-content: center;
  padding: 5px 6px;
  gap: 6px;
  background: var(--bg);
  overflow: auto;
}
.kb-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 3px;
  max-width: 1200px;
}
.kb-row {
  display: flex;
  gap: 3px;
  flex: 1;
}

/* ─── KEY BUTTON ─── */
.k {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--key-bg);
  color: var(--text);
  border: 1px solid var(--key-border);
  border-radius: 6px;
  box-shadow: 0 3px 0 var(--key-shadow), 0 2px 4px rgba(0,0,0,.4);
  font-size: clamp(11px, 1.7vw, 15px);
  font-weight: 600;
  cursor: pointer;
  transition: transform .05s, background .08s, box-shadow .05s;
  min-height: 38px;
  line-height: 1.2;
  -webkit-touch-callout: none;
}
.k .sub {
  font-size: 9px;
  color: var(--accent);
  line-height: 1;
}
.k .lbl { line-height: 1; }
/* Special key backgrounds */
.k.sp  { background: var(--key-special); font-size: clamp(9px,1.3vw,12px); }
.k.ent { background: var(--enter-bg); border-color: var(--enter-border); }
/* Width variants */
.k.w15 { flex: 1.5; }
.k.w18 { flex: 1.8; }
.k.w2  { flex: 2; }
.k.w22 { flex: 2.2; }
.k.w24 { flex: 2.4; }
.k.w13 { flex: 1.3; }
.k.w12 { flex: 1.2; }
.k.space { flex: 6; background: #2a313c; font-size: 11px; color: var(--text-dim); }
.k.arr { background: #1c222b; color: var(--accent); font-size: 14px; }
/* Press state */
.k.pressed, .k:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--key-shadow);
  background: var(--key-active-bg) !important;
  border-color: var(--key-active-border) !important;
  color: #fff !important;
}
/* Latched modifier */
.k.latched {
  background: var(--key-mod-active) !important;
  border-color: #3fb950 !important;
  color: #fff !important;
  box-shadow: 0 0 8px rgba(63,185,80,.5) !important;
}

/* ─── NUMPAD ─── */
.kb-numpad {
  background: var(--panel-bg);
  border-radius: 8px;
  padding: 5px;
  border: 1px solid var(--key-border);
  display: flex;
}
.numpad-grid {
  display: grid;
  grid-template-columns: repeat(4, 46px);
  grid-auto-rows: 44px;
  gap: 3px;
}
.np-tall { grid-row: span 2; }
.np-wide { grid-column: span 2; }

/* ─── FOOTER ─── */
.footer {
  background: var(--header-bg);
  border-top: 1px solid var(--key-border);
  padding: 3px 10px;
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ─── LAPTOP TRACKPAD DECK ─── */
.top-bar { order: 1; }
.mod-strip { order: 2; }
.panel { order: 3; }
.laptop-deck {
  order: 4; /* Default: ATAS (Top) */
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  background: linear-gradient(180deg, #13171e 0%, #0d1015 100%);
  border-bottom: 1px solid #283140;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  padding: 6px 12px;
  gap: 12px;
  flex-shrink: 0;
  min-height: 110px;
  max-height: 180px;
  height: clamp(110px, 20vh, 180px);
}
.laptop-deck.pos-bottom {
  order: 6; /* Posisi Bawah */
  border-top: 1px solid #283140;
  border-bottom: none;
  box-shadow: 0 -4px 15px rgba(0,0,0,0.4);
}
.kb-wrap {
  order: 5;
}
.footer {
  order: 7;
}
.deck-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid #303947;
  color: var(--accent);
  font-size: 10px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.deck-btn:hover {
  background: rgba(88,166,255,0.15);
  color: #fff;
}
.laptop-deck.hidden {
  display: none;
}
.palm-rest {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 6px 10px;
  color: var(--text-dim);
  font-size: 11px;
}
.palm-left {
  align-items: flex-start;
}
.palm-right {
  align-items: flex-end;
}
.palm-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  color: var(--accent);
  background: rgba(88, 166, 255, 0.1);
  border: 1px solid rgba(88, 166, 255, 0.2);
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 4px;
}
.palm-tip {
  font-size: 10px;
  color: var(--text-dim);
  max-width: 180px;
  line-height: 1.3;
}
.palm-settings {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.palm-label {
  font-size: 10px;
  color: var(--text-dim);
}
.palm-slider {
  width: 90px;
  height: 4px;
  accent-color: var(--accent);
  cursor: pointer;
}

/* Trackpad Center Box */
.trackpad-container {
  flex: 0 1 440px;
  width: min(440px, 55vw);
  display: flex;
  flex-direction: column;
  background: #181d26;
  border: 1px solid #303947;
  border-radius: 12px;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 3px 10px rgba(0,0,0,0.3);
  overflow: hidden;
  position: relative;
}
.trackpad-surface {
  flex: 1;
  min-height: 70px;
  background: radial-gradient(circle at 50% 30%, #202734 0%, #161b24 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  touch-action: none;
  cursor: crosshair;
  border-bottom: 1px solid #2b3442;
  overflow: hidden;
}
.trackpad-surface:active {
  background: radial-gradient(circle at 50% 30%, #252e3d 0%, #19202a 100%);
}
.tp-guide-content {
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  opacity: 0.65;
  transition: opacity 0.2s;
}
.tp-icon {
  font-size: 16px;
}
.tp-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.5px;
}
.tp-instructions {
  font-size: 9px;
  color: var(--text-dim);
  text-align: center;
  padding: 0 8px;
}
.tp-pointer-glow {
  position: absolute;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(88,166,255,0.4) 0%, rgba(88,166,255,0) 70%);
  pointer-events: none;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 0.15s;
}

/* Trackpad Physical Buttons */
.trackpad-buttons {
  display: flex;
  height: 34px;
  background: #191f29;
}
.tp-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
  touch-action: manipulation;
}
.tp-btn:hover {
  background: rgba(255,255,255,0.04);
  color: var(--text);
}
.tp-btn:active, .tp-btn.active {
  background: var(--key-active-bg);
  color: #fff;
}
.tp-btn-divider {
  width: 1px;
  background: #2b3442;
  height: 60%;
  margin: auto 0;
}
@media (max-width: 650px) {
  .palm-rest { display: none; }
  .trackpad-container { flex: 1; width: 100%; }
}

/* ─── Tablet Specific Layout (iPad / Android Tablet) ─── */
@media (min-width: 768px) and (min-height: 500px) {
  .laptop-deck {
    min-height: 200px;
    max-height: 380px;
    height: clamp(200px, 32vh, 360px);
    padding: 10px 24px;
    gap: 20px;
  }
  .trackpad-container {
    flex: 0 1 580px;
    width: min(600px, 62vw);
    border-radius: 16px;
  }
  .trackpad-surface {
    min-height: 150px;
  }
  .trackpad-buttons {
    height: 46px;
  }
  .tp-btn {
    font-size: 13px;
    gap: 8px;
  }
  .tp-icon {
    font-size: 22px;
  }
  .tp-label {
    font-size: 13px;
  }
  .tp-instructions {
    font-size: 11px;
  }
  .palm-badge {
    font-size: 11px;
    padding: 3px 10px;
  }
  .palm-tip {
    font-size: 11px;
    max-width: 220px;
  }
  .palm-label {
    font-size: 11px;
  }
  .palm-slider {
    width: 120px;
    height: 6px;
  }
}

/* ─── Large Tablet & Desktop View (iPad Pro 11"/12.9", 1080p+ Tablet) ─── */
@media (min-width: 960px) and (min-height: 680px) {
  .laptop-deck {
    min-height: 250px;
    max-height: 440px;
    height: clamp(250px, 36vh, 440px);
    padding: 14px 36px;
  }
  .trackpad-container {
    flex: 0 1 660px;
    width: min(680px, 65vw);
    border-radius: 18px;
  }
  .trackpad-surface {
    min-height: 190px;
  }
  .trackpad-buttons {
    height: 52px;
  }
  .tp-btn {
    font-size: 14px;
    gap: 10px;
  }
  .palm-badge {
    font-size: 12px;
  }
  .palm-tip {
    font-size: 12px;
  }
  .palm-label {
    font-size: 12px;
  }
}

@media (orientation: portrait) {
  .kb-wrap { justify-content: flex-start; overflow-x: auto; }
  .kb-main { min-width: 640px; }
  .k { min-height: 46px; }
}
  </style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="left-controls">
      <span class="logo">⌨️ DigiKeyboard</span>
      <span id="badge" class="status-badge disconnected">
        <span class="dot"></span>
        <span id="badge-txt">Menghubungkan...</span>
      </span>
      <span id="ping" class="ping">-- ms</span>
    </div>
    <div class="right-controls">
      <button class="tbtn" id="btn-fn">Fn</button>
      <button class="tbtn" id="btn-nav">Nav</button>
      <button class="tbtn" id="btn-num">123</button>
      <button class="tbtn" id="btn-sc">⚡</button>
      <button class="tbtn on" id="btn-tp" title="Toggle Trackpad Laptop">🖱️ Pad</button>
      <button class="tbtn on" id="btn-latch" title="Sticky modifier – Ctrl/Shift/Alt terkunci sampai tombol berikutnya">Latch</button>
      <button class="tbtn on" id="btn-haptic" title="Haptic feedback">📳</button>
      <button class="tbtn" id="btn-fs">⛶</button>
    </div>
  </header>

  <!-- MODIFIER INDICATOR -->
  <div class="mod-strip">
    <span class="mod-pill" id="tag-ctrl">CTRL</span>
    <span class="mod-pill" id="tag-alt">ALT</span>
    <span class="mod-pill" id="tag-shift">SHIFT</span>
    <span class="mod-pill" id="tag-win">WIN</span>
    <span class="mod-pill" id="tag-caps">CAPS</span>
  </div>

  <!-- SHORTCUT BAR -->
  <div class="panel hidden" id="sc-bar">
    <button class="sc-btn" data-combo="ctrl,c">Ctrl+C</button>
    <button class="sc-btn" data-combo="ctrl,v">Ctrl+V</button>
    <button class="sc-btn" data-combo="ctrl,x">Ctrl+X</button>
    <button class="sc-btn" data-combo="ctrl,z">Ctrl+Z</button>
    <button class="sc-btn" data-combo="ctrl,y">Ctrl+Y</button>
    <button class="sc-btn" data-combo="ctrl,a">Ctrl+A</button>
    <button class="sc-btn" data-combo="ctrl,s">Ctrl+S</button>
    <button class="sc-btn" data-combo="ctrl,f">Ctrl+F</button>
    <button class="sc-btn" data-combo="alt,tab">Alt+Tab</button>
    <button class="sc-btn" data-combo="cmd,d">Win+D</button>
    <button class="sc-btn danger" data-combo="ctrl,alt,delete">Ctrl+Alt+Del</button>
  </div>

  <!-- FN ROW -->
  <div class="panel hidden" id="fn-row">
    <button class="k fn-key sp" data-key="esc">Esc</button>
    <button class="k fn-key sp" data-key="f1">F1</button>
    <button class="k fn-key sp" data-key="f2">F2</button>
    <button class="k fn-key sp" data-key="f3">F3</button>
    <button class="k fn-key sp" data-key="f4">F4</button>
    <button class="k fn-key sp" data-key="f5">F5</button>
    <button class="k fn-key sp" data-key="f6">F6</button>
    <button class="k fn-key sp" data-key="f7">F7</button>
    <button class="k fn-key sp" data-key="f8">F8</button>
    <button class="k fn-key sp" data-key="f9">F9</button>
    <button class="k fn-key sp" data-key="f10">F10</button>
    <button class="k fn-key sp" data-key="f11">F11</button>
    <button class="k fn-key sp" data-key="f12">F12</button>
  </div>

  <!-- NAV ROW -->
  <div class="panel hidden" id="nav-row">
    <button class="k nav-key sp" data-key="print_screen">PrtSc</button>
    <button class="k nav-key sp" data-key="scroll_lock">ScrLk</button>
    <button class="k nav-key sp" data-key="pause">Pause</button>
    <button class="k nav-key sp" data-key="insert">Ins</button>
    <button class="k nav-key sp" data-key="delete">Del</button>
    <button class="k nav-key sp" data-key="home">Home</button>
    <button class="k nav-key sp" data-key="end">End</button>
    <button class="k nav-key sp" data-key="page_up">PgUp</button>
    <button class="k nav-key sp" data-key="page_down">PgDn</button>
  </div>

  <!-- LAPTOP TRACKPAD DECK (ATAS / TOP POSITION) -->
  <section class="laptop-deck" id="laptop-deck">
    <div class="palm-rest palm-left">
      <div class="palm-badge">LAPTOP DECK</div>
      <button class="deck-btn" id="btn-tp-pos" title="Tukar Posisi Trackpad (Atas / Bawah)">⇅ Posisi: Atas</button>
    </div>

    <div class="trackpad-container">
      <div class="trackpad-surface" id="trackpad-surface">
        <div class="tp-guide-content">
          <div class="tp-icon">🖱️</div>
          <div class="tp-label">Trackpad Multi-Touch</div>
          <div class="tp-instructions">1 Jari: Kursor &amp; Klik • 2 Jari: Scroll &amp; Klik Kanan</div>
        </div>
        <div class="tp-pointer-glow" id="tp-glow"></div>
      </div>
      <div class="trackpad-buttons">
        <button class="tp-btn tp-left" id="tp-btn-left">
          <span>⯇ Klik Kiri</span>
        </button>
        <div class="tp-btn-divider"></div>
        <button class="tp-btn tp-right" id="tp-btn-right">
          <span>Klik Kanan ⯈</span>
        </button>
      </div>
    </div>

    <div class="palm-rest palm-right">
      <div class="palm-settings">
        <label for="tp-speed" class="palm-label">Sensitivitas: <span id="tp-speed-val">1.2x</span></label>
        <input type="range" id="tp-speed" min="0.5" max="3.0" step="0.1" value="1.2" class="palm-slider">
      </div>
    </div>
  </section>

  <!-- KEYBOARD + NUMPAD -->
  <main class="kb-wrap">
    <section class="kb-main">

      <!-- ROW 1: Number row -->
      <div class="kb-row">
        <button class="k" data-char="`" data-shift="~"><span class="sub">~</span><span class="lbl">`</span></button>
        <button class="k" data-char="1" data-shift="!"><span class="sub">!</span><span class="lbl">1</span></button>
        <button class="k" data-char="2" data-shift="@"><span class="sub">@</span><span class="lbl">2</span></button>
        <button class="k" data-char="3" data-shift="#"><span class="sub">#</span><span class="lbl">3</span></button>
        <button class="k" data-char="4" data-shift="$"><span class="sub">$</span><span class="lbl">4</span></button>
        <button class="k" data-char="5" data-shift="%"><span class="sub">%</span><span class="lbl">5</span></button>
        <button class="k" data-char="6" data-shift="^"><span class="sub">^</span><span class="lbl">6</span></button>
        <button class="k" data-char="7" data-shift="&amp;"><span class="sub">&amp;</span><span class="lbl">7</span></button>
        <button class="k" data-char="8" data-shift="*"><span class="sub">*</span><span class="lbl">8</span></button>
        <button class="k" data-char="9" data-shift="("><span class="sub">(</span><span class="lbl">9</span></button>
        <button class="k" data-char="0" data-shift=")"><span class="sub">)</span><span class="lbl">0</span></button>
        <button class="k" data-char="-" data-shift="_"><span class="sub">_</span><span class="lbl">-</span></button>
        <button class="k" data-char="=" data-shift="+"><span class="sub">+</span><span class="lbl">=</span></button>
        <button class="k sp w2" data-key="backspace">⌫ Back</button>
      </div>

      <!-- ROW 2: Tab + QWERTY -->
      <div class="kb-row">
        <button class="k sp w15" data-key="tab">Tab ⇥</button>
        <button class="k" data-char="q" data-shift="Q">Q</button>
        <button class="k" data-char="w" data-shift="W">W</button>
        <button class="k" data-char="e" data-shift="E">E</button>
        <button class="k" data-char="r" data-shift="R">R</button>
        <button class="k" data-char="t" data-shift="T">T</button>
        <button class="k" data-char="y" data-shift="Y">Y</button>
        <button class="k" data-char="u" data-shift="U">U</button>
        <button class="k" data-char="i" data-shift="I">I</button>
        <button class="k" data-char="o" data-shift="O">O</button>
        <button class="k" data-char="p" data-shift="P">P</button>
        <button class="k" data-char="[" data-shift="{"><span class="sub">{</span><span class="lbl">[</span></button>
        <button class="k" data-char="]" data-shift="}"><span class="sub">}</span><span class="lbl">]</span></button>
        <button class="k w12" data-char="\" data-shift="|"><span class="sub">|</span><span class="lbl">\</span></button>
      </div>

      <!-- ROW 3: Caps + ASDF + Enter -->
      <div class="kb-row">
        <button class="k sp w18" data-key="caps_lock" id="key-caps">Caps ⇪</button>
        <button class="k" data-char="a" data-shift="A">A</button>
        <button class="k" data-char="s" data-shift="S">S</button>
        <button class="k" data-char="d" data-shift="D">D</button>
        <button class="k" data-char="f" data-shift="F">F</button>
        <button class="k" data-char="g" data-shift="G">G</button>
        <button class="k" data-char="h" data-shift="H">H</button>
        <button class="k" data-char="j" data-shift="J">J</button>
        <button class="k" data-char="k" data-shift="K">K</button>
        <button class="k" data-char="l" data-shift="L">L</button>
        <button class="k" data-char=";" data-shift=":"><span class="sub">:</span><span class="lbl">;</span></button>
        <button class="k" data-char="'" data-shift='"'><span class="sub">"</span><span class="lbl">'</span></button>
        <button class="k ent w22" data-key="enter">Enter ↵</button>
      </div>

      <!-- ROW 4: Shift + ZXCV + Up -->
      <div class="kb-row">
        <button class="k sp w24" data-key="shift" id="key-shift-l">⇧ Shift</button>
        <button class="k" data-char="z" data-shift="Z">Z</button>
        <button class="k" data-char="x" data-shift="X">X</button>
        <button class="k" data-char="c" data-shift="C">C</button>
        <button class="k" data-char="v" data-shift="V">V</button>
        <button class="k" data-char="b" data-shift="B">B</button>
        <button class="k" data-char="n" data-shift="N">N</button>
        <button class="k" data-char="m" data-shift="M">M</button>
        <button class="k" data-char="," data-shift="<"><span class="sub">&lt;</span><span class="lbl">,</span></button>
        <button class="k" data-char="." data-shift=">"><span class="sub">&gt;</span><span class="lbl">.</span></button>
        <button class="k" data-char="/" data-shift="?"><span class="sub">?</span><span class="lbl">/</span></button>
        <button class="k sp w22" data-key="shift" id="key-shift-r">⇧ Shift</button>
        <button class="k arr" data-key="up">▲</button>
      </div>

      <!-- ROW 5: Bottom modifiers + Space + Arrows -->
      <div class="kb-row">
        <button class="k sp w13" data-key="ctrl" id="key-ctrl-l">Ctrl</button>
        <button class="k sp w13" data-key="cmd" id="key-win">⊞ Win</button>
        <button class="k sp w13" data-key="alt" id="key-alt-l">Alt</button>
        <button class="k space" data-key="space">Space Bar</button>
        <button class="k sp w13" data-key="alt" id="key-alt-r">Alt</button>
        <button class="k sp w13" data-key="ctrl" id="key-ctrl-r">Ctrl</button>
        <button class="k arr" data-key="left">◀</button>
        <button class="k arr" data-key="down">▼</button>
        <button class="k arr" data-key="right">▶</button>
      </div>

    </section>

    <!-- NUMPAD -->
    <section class="kb-numpad panel hidden" id="numpad">
      <div class="numpad-grid">
        <button class="k sp" data-key="num_lock">Num</button>
        <button class="k" data-char="/">/</button>
        <button class="k" data-char="*">*</button>
        <button class="k" data-char="-">-</button>

        <button class="k" data-char="7">7</button>
        <button class="k" data-char="8">8</button>
        <button class="k" data-char="9">9</button>
        <button class="k np-tall" data-char="+">+</button>

        <button class="k" data-char="4">4</button>
        <button class="k" data-char="5">5</button>
        <button class="k" data-char="6">6</button>

        <button class="k" data-char="1">1</button>
        <button class="k" data-char="2">2</button>
        <button class="k" data-char="3">3</button>
        <button class="k ent np-tall" data-key="enter">↵</button>

        <button class="k np-wide" data-char="0">0</button>
        <button class="k" data-char=".">.</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <b>Tip:</b> Mode <b>Latch</b> aktif → tekan Ctrl lalu C untuk Ctrl+C. Trackpad terintegrasi di atas keyboard.
  </footer>
</div>

<script>
(function() {
'use strict';

// ── State ──
let ws = null, connected = false;
let pingT = 0, pingTimer = null;
let latch = true, haptic = true;

const mods = { ctrl: false, alt: false, shift: false, cmd: false, caps_lock: false };

// ── DOM ──
const badge    = document.getElementById('badge');
const badgeTxt = document.getElementById('badge-txt');
const pingEl   = document.getElementById('ping');

function $(id) { return document.getElementById(id); }

// ── Panels ──
function togglePanel(panelId, btnId) {
  const p = $(panelId), b = $(btnId);
  p.classList.toggle('hidden');
  b.classList.toggle('on', !p.classList.contains('hidden'));
}
$('btn-fn').onclick    = () => togglePanel('fn-row', 'btn-fn');
$('btn-nav').onclick   = () => togglePanel('nav-row', 'btn-nav');
$('btn-num').onclick   = () => togglePanel('numpad', 'btn-num');
$('btn-sc').onclick    = () => togglePanel('sc-bar', 'btn-sc');
$('btn-latch').onclick = () => {
  latch = !latch;
  $('btn-latch').classList.toggle('on', latch);
  vibe(15);
};
$('btn-haptic').onclick = () => {
  haptic = !haptic;
  $('btn-haptic').classList.toggle('on', haptic);
  if (haptic) vibe(30);
};
$('btn-fs').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
};

// ── Haptic ──
function vibe(ms = 12) {
  if (haptic && navigator.vibrate) { try { navigator.vibrate(ms); } catch(e){} }
}

// ── WebSocket ──
function connect() {
  const loc = window.location;
  const proto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = proto + '//' + loc.host + '/ws';

  setStatus(false, 'Menghubungkan...');
  try { ws = new WebSocket(url); } catch(e) { setTimeout(connect, 2000); return; }

  ws.onopen = () => {
    connected = true;
    setStatus(true, 'Terhubung');
    pingTimer = setInterval(() => {
      if (connected && ws.readyState === 1) {
        pingT = performance.now();
        send({ type: 'ping' });
      }
    }, 3000);
  };
  ws.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'pong') pingEl.textContent = Math.round(performance.now() - pingT) + ' ms';
    } catch(err) {}
  };
  ws.onclose = () => {
    connected = false;
    clearInterval(pingTimer);
    pingEl.textContent = '-- ms';
    setStatus(false, 'Terputus');
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();
}

function send(obj) {
  if (connected && ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

function setStatus(ok, txt) {
  badge.classList.toggle('connected', ok);
  badge.classList.toggle('disconnected', !ok);
  badgeTxt.textContent = txt;
}

// ── Modifier UI ──
function refreshMods() {
  ['ctrl','alt','shift','win','caps'].forEach(k => {
    const el = document.getElementById('tag-' + k);
    if (el) el.classList.toggle('on', k === 'win' ? mods.cmd : mods[k === 'caps' ? 'caps_lock' : k]);
  });

  // Visual latch on modifier keys
  document.querySelectorAll('[data-key="ctrl"]').forEach(el => el.classList.toggle('latched', mods.ctrl));
  document.querySelectorAll('[data-key="alt"]').forEach(el => el.classList.toggle('latched', mods.alt));
  document.querySelectorAll('[data-key="shift"]').forEach(el => el.classList.toggle('latched', mods.shift));
  document.querySelectorAll('[data-key="cmd"]').forEach(el => el.classList.toggle('latched', mods.cmd));
  const cap = document.getElementById('key-caps');
  if (cap) cap.classList.toggle('latched', mods.caps_lock);

  // Swap displayed letter case when Shift or Caps active
  const shifted = mods.shift || mods.caps_lock;
  document.querySelectorAll('.k[data-char]').forEach(el => {
    const ch = el.dataset.char;
    if (ch && ch.length === 1 && /[a-z]/i.test(ch)) {
      // find span.lbl or direct text
      const lbl = el.querySelector('.lbl') || el;
      if (!el.dataset.shift || el.dataset.shift.length === 1) {
        lbl.textContent = shifted ? ch.toUpperCase() : ch.toLowerCase();
      }
    }
  });
}

// ── Key Press Logic ──
const MOD_KEYS = new Set(['ctrl','alt','shift','cmd','caps_lock']);

function pressKey(el) {
  if (!el) return;
  const btn = el.closest('.k');
  if (!btn) return;

  const key  = btn.dataset.key  || null;
  const char = btn.dataset.char || null;
  const shiftChar = btn.dataset.shift || null;

  vibe(12);
  btn.classList.add('pressed');

  // MODIFIER KEY
  if (key && MOD_KEYS.has(key)) {
    if (latch) {
      mods[key] = !mods[key];
      send({ type: mods[key] ? 'keydown' : 'keyup', key });
    } else {
      mods[key] = true;
      send({ type: 'keydown', key });
    }
    refreshMods();
    return;
  }

  // NORMAL KEY
  let sendChar = char;
  if (char) {
    if (mods.shift && shiftChar) {
      sendChar = shiftChar;
    } else if (mods.shift || mods.caps_lock) {
      sendChar = char.toUpperCase();
    }
  }

  send({
    type: 'keypress',
    key: key || null,
    char: sendChar || null,
    modifiers: { ctrl: mods.ctrl, alt: mods.alt, shift: mods.shift, cmd: mods.cmd }
  });

  // Release latched modifiers (except caps_lock)
  if (latch) {
    let changed = false;
    ['ctrl','alt','shift','cmd'].forEach(m => {
      if (mods[m]) { mods[m] = false; send({ type: 'keyup', key: m }); changed = true; }
    });
    if (changed) refreshMods();
  }
}

function releaseKey(el) {
  if (!el) return;
  const btn = el.closest('.k');
  if (!btn) return;
  btn.classList.remove('pressed');
  const key = btn.dataset.key || null;
  if (!latch && key && MOD_KEYS.has(key)) {
    mods[key] = false;
    send({ type: 'keyup', key });
    refreshMods();
  }
}

// ── Touch Events (Multi-Touch) ──
const touches = new Map();

document.getElementById('app').addEventListener('touchstart', (e) => {
  // Allow toolbar buttons, shortcuts, and laptop trackpad deck to handle their own events
  if (e.target.closest('.top-bar, .sc-btn, .tbtn, .laptop-deck')) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el) { touches.set(t.identifier, el); pressKey(el); }
  }
}, { passive: false });

document.getElementById('app').addEventListener('touchend', (e) => {
  if (e.target.closest('.top-bar, .sc-btn, .tbtn, .laptop-deck')) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    releaseKey(touches.get(t.identifier));
    touches.delete(t.identifier);
  }
}, { passive: false });

document.getElementById('app').addEventListener('touchcancel', (e) => {
  for (const t of e.changedTouches) {
    releaseKey(touches.get(t.identifier));
    touches.delete(t.identifier);
  }
}, { passive: false });

// ── Mouse Fallback (Desktop Testing) ──
let mouseEl = null;
document.getElementById('app').addEventListener('mousedown', (e) => {
  if (e.target.closest('.top-bar, .sc-btn, .tbtn, .laptop-deck')) return;
  mouseEl = e.target;
  pressKey(e.target);
});
window.addEventListener('mouseup', () => {
  if (mouseEl) { releaseKey(mouseEl); mouseEl = null; }
});

// ── Shortcut Buttons ──
document.querySelectorAll('.sc-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    vibe(20);
    const keys = (btn.dataset.combo || '').split(',');
    if (keys.length) send({ type: 'combo', keys });
  });
});

// ── Laptop Trackpad Controller ──
let tpSpeed = 1.2;
const tpSpeedSlider = $('tp-speed');
const tpSpeedVal = $('tp-speed-val');
if (tpSpeedSlider) {
  tpSpeedSlider.addEventListener('input', (e) => {
    tpSpeed = parseFloat(e.target.value);
    if (tpSpeedVal) tpSpeedVal.textContent = tpSpeed.toFixed(1) + 'x';
  });
}

const btnTpToggle = $('btn-tp');
if (btnTpToggle) {
  btnTpToggle.addEventListener('click', () => {
    const deck = $('laptop-deck');
    deck.classList.toggle('hidden');
    btnTpToggle.classList.toggle('on', !deck.classList.contains('hidden'));
  });
}

// Position switcher: Atas vs Bawah
const btnTpPos = $('btn-tp-pos');
let tpPos = localStorage.getItem('digi_tp_pos') || 'top';

function applyTpPosition(pos) {
  const deck = $('laptop-deck');
  if (!deck) return;
  if (pos === 'bottom') {
    deck.classList.add('pos-bottom');
    if (btnTpPos) btnTpPos.textContent = '⇅ Posisi: Bawah';
  } else {
    deck.classList.remove('pos-bottom');
    if (btnTpPos) btnTpPos.textContent = '⇅ Posisi: Atas';
  }
}

if (btnTpPos) {
  btnTpPos.addEventListener('click', () => {
    tpPos = tpPos === 'top' ? 'bottom' : 'top';
    localStorage.setItem('digi_tp_pos', tpPos);
    applyTpPosition(tpPos);
    vibe(20);
  });
}
applyTpPosition(tpPos);

const tpSurface = $('trackpad-surface');
const tpGlow = $('tp-glow');

if (tpSurface) {
  const touchStartMap = new Map();
  let startTime = 0;
  let totalDistance = 0;
  let prevX = 0, prevY = 0;
  let prevScrollY = 0;
  let lastMoveTime = 0;

  tpSurface.addEventListener('touchstart', (e) => {
    e.preventDefault();
    startTime = Date.now();
    totalDistance = 0;

    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      touchStartMap.set(t.identifier, { x: t.clientX, y: t.clientY });
    }

    if (e.touches.length === 1) {
      const t = e.touches[0];
      prevX = t.clientX;
      prevY = t.clientY;
      if (tpGlow) {
        const rect = tpSurface.getBoundingClientRect();
        tpGlow.style.left = (t.clientX - rect.left) + 'px';
        tpGlow.style.top = (t.clientY - rect.top) + 'px';
        tpGlow.style.opacity = '1';
      }
    } else if (e.touches.length === 2) {
      prevScrollY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    }
  }, { passive: false });

  tpSurface.addEventListener('touchmove', (e) => {
    e.preventDefault();

    if (e.touches.length === 1) {
      const t = e.touches[0];
      const dx = (t.clientX - prevX) * tpSpeed * 1.5;
      const dy = (t.clientY - prevY) * tpSpeed * 1.5;
      totalDistance += Math.hypot(dx, dy);

      prevX = t.clientX;
      prevY = t.clientY;

      if (tpGlow) {
        const rect = tpSurface.getBoundingClientRect();
        tpGlow.style.left = (t.clientX - rect.left) + 'px';
        tpGlow.style.top = (t.clientY - rect.top) + 'px';
      }

      const now = Date.now();
      if (now - lastMoveTime >= 8) { // throttle ~120fps
        send({ type: 'mousemove', dx, dy });
        lastMoveTime = now;
      }
    } else if (e.touches.length === 2) {
      // 2-finger scroll
      const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const diffY = currentY - prevScrollY;
      totalDistance += Math.abs(diffY);

      if (Math.abs(diffY) > 3) {
        const scrollAmount = Math.round(diffY * 0.25 * tpSpeed);
        if (scrollAmount !== 0) {
          send({ type: 'mousescroll', dx: 0, dy: scrollAmount });
        }
        prevScrollY = currentY;
      }
    }
  }, { passive: false });

  tpSurface.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (tpGlow) tpGlow.style.opacity = '0';
    const duration = Date.now() - startTime;

    // Check tap
    if (e.touches.length === 0) {
      if (touchStartMap.size === 1 && totalDistance < 12 && duration < 300) {
        // 1-finger tap -> Left Click
        send({ type: 'mouseclick', button: 'left' });
        vibe(15);
      } else if (touchStartMap.size === 2 && totalDistance < 18 && duration < 350) {
        // 2-finger tap -> Right Click
        send({ type: 'mouseclick', button: 'right' });
        vibe(25);
      }
      touchStartMap.clear();
    }
  }, { passive: false });

  tpSurface.addEventListener('touchcancel', () => {
    touchStartMap.clear();
    if (tpGlow) tpGlow.style.opacity = '0';
  });

  // Desktop mouse test on trackpad surface
  let isMouseDragging = false;
  let mouseStartX = 0, mouseStartY = 0;
  tpSurface.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    isMouseDragging = true;
    mouseStartX = e.clientX;
    mouseStartY = e.clientY;
  });
  window.addEventListener('mousemove', (e) => {
    if (!isMouseDragging) return;
    const dx = (e.clientX - mouseStartX) * tpSpeed * 1.5;
    const dy = (e.clientY - mouseStartY) * tpSpeed * 1.5;
    mouseStartX = e.clientX;
    mouseStartY = e.clientY;
    send({ type: 'mousemove', dx, dy });
  });
  window.addEventListener('mouseup', () => {
    isMouseDragging = false;
  });
}

// Trackpad Left & Right Physical Buttons
const tpBtnLeft = $('tp-btn-left');
const tpBtnRight = $('tp-btn-right');

if (tpBtnLeft) {
  const onLeftDown = (e) => {
    e.preventDefault();
    tpBtnLeft.classList.add('active');
    send({ type: 'mousedown', button: 'left' });
    vibe(15);
  };
  const onLeftUp = (e) => {
    e.preventDefault();
    tpBtnLeft.classList.remove('active');
    send({ type: 'mouseup', button: 'left' });
  };
  tpBtnLeft.addEventListener('touchstart', onLeftDown, { passive: false });
  tpBtnLeft.addEventListener('touchend', onLeftUp, { passive: false });
  tpBtnLeft.addEventListener('mousedown', onLeftDown);
  tpBtnLeft.addEventListener('mouseup', onLeftUp);
}

if (tpBtnRight) {
  const onRightClick = (e) => {
    e.preventDefault();
    tpBtnRight.classList.add('active');
    send({ type: 'mouseclick', button: 'right' });
    vibe(25);
    setTimeout(() => tpBtnRight.classList.remove('active'), 120);
  };
  tpBtnRight.addEventListener('touchstart', onRightClick, { passive: false });
  tpBtnRight.addEventListener('mousedown', onRightClick);
}

// ── Init ──
window.addEventListener('contextmenu', e => e.preventDefault());
refreshMods();
connect();
})();
</script>
</body>
