<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#30363d" stroke-width="6"/>

  <!-- Keyboard Base -->
  <rect x="56" y="120" width="400" height="272" rx="28" fill="#161b22" stroke="#58a6ff" stroke-width="5" filter="url(#glow)"/>

  <!-- Power / Connection LED -->
  <circle cx="420" cy="144" r="7" fill="#388bfd" />

  <!-- Keycaps Grid -->
  <!-- Row 1 -->
  <rect x="76" y="160" width="58" height="52" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="144" y="160" width="58" height="52" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="212" y="160" width="58" height="52" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="280" y="160" width="58" height="52" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="348" y="160" width="88" height="52" rx="10" fill="url(#blueGrad)" stroke="#58a6ff" stroke-width="2"/>

  <!-- Row 2 -->
  <rect x="76" y="224" width="76" height="52" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="162" y="224" width="58" height="52" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="230" y="224" width="58" height="52" rx="10" fill="url(#blueGrad)" stroke="#58a6ff" stroke-width="2"/>
  <rect x="298" y="224" width="58" height="52" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="366" y="224" width="70" height="52" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>

  <!-- Row 3 -->
  <rect x="76" y="288" width="88" height="52" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="174" y="288" width="58" height="52" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="242" y="288" width="58" height="52" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="310" y="288" width="126" height="52" rx="10" fill="url(#blueGrad)" stroke="#58a6ff" stroke-width="2"/>

  <!-- Row 4: Space bar row -->
  <rect x="76" y="352" width="60" height="28" rx="8" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <rect x="146" y="352" width="220" height="28" rx="8" fill="#30363d" stroke="#58a6ff" stroke-width="2"/>
  <rect x="376" y="352" width="60" height="28" rx="8" fill="#21262d" stroke="#30363d" stroke-width="2"/>
</svg>
