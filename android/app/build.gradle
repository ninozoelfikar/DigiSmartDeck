plugins {
    id 'com.android.application'
}

def getVersionDetails = { ->
    def versionFile = file('../../VERSION')
    def versionStr = "1.0.0"
    if (versionFile.exists()) {
        versionStr = versionFile.text.trim()
    }
    def cleanVer = versionStr.replaceAll(/[^0-9.]/, '')
    def parts = cleanVer.tokenize('.')
    int major = parts.size() > 0 ? parts[0].toInteger() : 1
    int minor = parts.size() > 1 ? parts[1].toInteger() : 0
    int patch = parts.size() > 2 ? parts[2].toInteger() : 0
    int build = parts.size() > 3 ? parts[3].toInteger() : 0
    int code = major * 1000000 + minor * 10000 + patch * 100 + build
    return [code: code, name: versionStr]
}
def appVersion = getVersionDetails()

android {
    namespace 'com.digikeyboard.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.digikeyboard.remote"
        minSdk 21
        targetSdk 34
        versionCode appVersion.code
        versionName appVersion.name

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
